name: Faux positif / False positive
description: Quelque chose d'anodin a été masqué à tort. / Something harmless was masked.
title: "[Faux positif] "
labels: ["detection"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Utilisez UNIQUEMENT de fausses valeurs / Use FAKE values only
        Si le texte contient des données réelles, remplacez-les avant de le copier ici.
  - type: textarea
    id: example
    attributes:
      label: Texte qui a été masqué à tort / Text wrongly masked
      render: text
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Catégorie affichée / Category shown
      placeholder: "ex. SIREN, PHONE, SSN"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Pourquoi ce n'est pas une donnée sensible / Why it is harmless
      placeholder: "C'est un numéro de commande, pas un SIREN."
  - type: input
    id: frequency
    attributes:
      label: Fréquence / How often
      placeholder: "Presque à chaque fois dans mes textes sur les factures"
